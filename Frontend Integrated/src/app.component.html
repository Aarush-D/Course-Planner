<div class="min-h-screen bg-slate-50">
  <main class="mx-auto max-w-7xl p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-4 h-[calc(100vh-1rem)]">

    <!-- Left Column: Chatbot -->
    <section class="md:col-span-3 h-full flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
      <app-chatbot
        (promptSubmitted)="onPromptSubmitted($event)"
        [isLoading]="loading()"
        [botReply]="coursePlan()?.rag_response"
      ></app-chatbot>
    </section>

    <!-- Center Column: Flowchart (Mermaid) -->
    <section class="md:col-span-6 h-full flex flex-col bg-white rounded-lg shadow-lg overflow-y-auto">
      <app-flowchart
        [isLoading]="loading()"
        [llm]="coursePlan()?.llm_flowchart"
      ></app-flowchart>
    </section>

    <!-- Right Column: Recommendations -->
    <section class="md:col-span-3 h-full flex flex-col bg-white rounded-lg shadow-lg overflow-y-auto">
      <app-recommendations
        [isLoading]="loading()"
        [recommendations]="coursePlan()?.recommendations"
        [rawText]="coursePlan()?.rag_response"
      ></app-recommendations>
    </section>

  </main>
</div>
