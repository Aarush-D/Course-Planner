<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200">
    <h2 class="text-lg font-semibold text-slate-700">Advisor Chat</h2>
    <p class="text-xs text-slate-500 mt-1">Select your department and ask anything about course planning.</p>

    <label class="block mt-3 text-xs font-semibold text-slate-600">Department / Major</label>
    <select
      class="mt-1 w-full rounded-md border border-slate-200 bg-white p-2 text-sm"
      [value]="dept()"
      (change)="dept.set(($any($event.target).value || 'CMPSC').toUpperCase())">
      <option value="CMPSC">CMPSC (Computer Science)</option>
      <option value="CMPEN">CMPEN (Computer Engineering)</option>
      <option value="MATH">MATH</option>
      <option value="STAT">STAT</option>
    </select>
  </div>

  <!-- Messages -->
  <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
    @for (m of messages(); track $index) {
      <div
        class="max-w-[95%] rounded-lg px-3 py-2 text-sm shadow-sm"
        [class.ml-auto]="m.role === 'user'"
        [class.bg-indigo-600]="m.role === 'user'"
        [class.text-white]="m.role === 'user'"
        [class.bg-white]="m.role === 'assistant'"
        [class.text-slate-700]="m.role === 'assistant'">
        {{ m.text }}
      </div>
    }

    @if (isLoading()) {
      <div class="bg-white text-slate-600 rounded-lg px-3 py-2 text-sm shadow-sm w-fit animate-pulse">
        Thinking…
      </div>
    }
  </div>

  <!-- Input -->
  <div class="p-4 border-t border-slate-200 bg-white">
    <textarea
      class="w-full resize-none rounded-md border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"
      rows="3"
      placeholder="Ask a question…"
      [value]="prompt()"
      (input)="prompt.set($any($event.target).value)"
      (keydown)="onKeyDown($event)"></textarea>

    <button
      class="mt-2 w-full rounded-md bg-indigo-600 text-white py-2 text-sm font-semibold disabled:opacity-50"
      (click)="onSubmit()"
      [disabled]="isLoading()">
      Send
    </button>
  </div>
</div>
