name: CI

on:
  # A feature-branch push with an open PR fired BOTH push and pull_request
  # for the identical commit -- the concurrency group below can't dedupe
  # them (github.ref differs: refs/heads/<branch> for push vs.
  # refs/pull/<PR>/merge for pull_request), so two full CI runs raced on
  # shared GitHub-hosted runners every time. That contention is the real
  # cause behind gen-ed-page.component.spec.ts's repeat flaky-timeout
  # failures (see commit 47a6e7f1, which raised the timeout to 20s and
  # still wasn't enough under worse contention) -- restricting push to
  # main means a feature branch only ever runs CI once, via pull_request;
  # main still gets push-triggered CI after a merge, when no concurrent
  # pull_request event exists for that commit to race against.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  backend-tests:
    name: Backend tests (unit, regression, edge case)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: >
          python -m pytest -v
          --junitxml=test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: Backend/test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/test-results.xml
          retention-days: 14

  # Evals 1 (parser accuracy) and 2 (plan validity) only: both are
  # deterministic and need no LLM. Evals 3 (LLM faithfulness) and 4 (RAG
  # recall) need a live Ollama/Groq and the gitignored RAG index, so they
  # are run by hand -- see "Evaluation" in README.md.
  #
  # This job reports; it does not gate on a threshold, because none has been
  # agreed. It fails only if the harness itself errors (a crash, an HTTP 5xx
  # from the app). Look at the step summary for the numbers.
  eval-deterministic:
    name: Eval harness (parser accuracy + plan validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r Backend/requirements.txt

      - name: Run evals 1 and 2
        run: python eval/run_eval.py --only parser,plans --out eval/results/ci.json

      - name: Summarize
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "eval/results/ci.json"
          if not os.path.exists(p):
              print("eval did not produce results")
              raise SystemExit
          r = json.load(open(p))["metrics"]
          def f(x): return f"{x['numerator']}/{x['denominator']} ({100*x['rate']:.1f}%)"
          pr = r["parser"]
          print("### Eval results (synthetic data; see README 'Evaluation' for limits)")
          print("| metric | value |\n|---|---|")
          print(f"| parser exact match | {f(pr['exact_match'])} |")
          for k, v in pr["per_field_accuracy"].items():
              print(f"| parser field `{k}` | {f(v)} |")
          pv = r["plan_validity"]
          sw, rs = pv["degree_plan_sweep"], pv["random_completed_sets"]
          print(f"| degree plans with zero violations | {sw['valid']}/{sw['total']} |")
          print(f"| random completed sets with zero violations | {rs['valid']}/{rs['total']} |")
          print(f"| violation rows (sweep / random) | {len(sw['violations'])} / {len(rs['violations'])} |")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci.json
          retention-days: 30
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build (compile/type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      # 24, not 20: jsdom 30 (the unit-test DOM) declares engines
      # ^22.22.2 || ^24.15.0, and on Node 20 its worker dies on
      # `webidl.util.markAsUncloneable is not a function` before a single
      # test runs. GitHub is deprecating Node 20 on runners as well.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (fails on TypeScript/template errors)
        run: npm run build

      # The Vitest harness (477924c3) had 52 passing tests that nothing in
      # CI ever ran -- a regression in any of them would have merged green.
      # Through `ng test`, not raw `vitest`: the Angular builder is what
      # compiles components for TestBed; invoked directly, 46 of 52 fail on
      # NgModule resolution, which looks like a broken suite but isn't.
      - name: Unit tests
        run: npx ng test --watch=false

  frontend-e2e:
    name: Frontend e2e (real browser)
    runs-on: ubuntu-latest
    # Blocking since 2026-09-24. It ran non-blocking (continue-on-error)
    # from its introduction until it had passed on every one of the last
    # 15 main runs across two weeks -- the "proven stable" bar the original
    # comment set. It drives a real browser against a live Flask + ng serve
    # stack, which is the only way to catch the class of bug that prompted
    # it: three runtime defects (Escape closing the wrong modal, a combobox
    # wiping its own query, a frozen loading spinner) all passed
    # `npm run build` and `tsc` clean. If it starts flaking, fix the flake;
    # don't put continue-on-error back.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r Backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      # Chromium only -- the suite never asks for Firefox or WebKit, and
      # each extra browser is another ~100MB download per run.
      - name: Install Chromium for Playwright
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          python Backend/app.py > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5001/api/degree-plans >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5001/api/degree-plans >/dev/null \
            || { echo "backend never came up:"; cat backend.log; exit 1; }

      # --proxy-config is what routes the app's relative /api calls to the
      # Flask process above (environment.ts ships an empty apiBaseUrl in dev).
      - name: Start frontend
        working-directory: Frontend
        run: |
          npx ng serve --port 4321 --proxy-config proxy.conf.json > serve.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:4321/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4321/ >/dev/null \
            || { echo "frontend never came up:"; cat serve.log; exit 1; }

      - name: Run e2e suite
        working-directory: Frontend
        run: npm run e2e

      # The screenshots are the point of keeping these on failure: they show
      # what the page actually looked like at the assertion that failed.
      - name: Upload screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            Frontend/e2e/shots/
            Frontend/serve.log
            backend.log
          retention-days: 14
          if-no-files-found: ignore
