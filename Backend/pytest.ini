[pytest]
# tests.py doesn't match pytest's default test_*.py / *_test.py discovery
# pattern, so it's named explicitly here rather than renamed — renaming
# would break every existing `python -m unittest tests` invocation and any
# tooling/docs that reference it by name.
python_files = tests.py
python_classes = Test*
python_functions = test_*
testpaths = .
addopts = -ra --strict-markers
