<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200">
    <h2 class="text-lg font-semibold text-slate-700">AI Recommendations</h2>
  </div>

  <div class="flex-grow p-6 overflow-y-auto">
    @if (isLoading()) {
      <p class="text-slate-400">Thinking…</p>
    }
    @else if (text()) {
      <pre class="whitespace-pre-wrap text-sm text-slate-700">
{{ text() }}
      </pre>
    }
    @else {
      <p class="text-slate-400">Ask a question to get recommendations.</p>
    }
  </div>
</div>
