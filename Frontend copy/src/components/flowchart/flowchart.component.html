<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200">
    <h2 class="text-lg font-semibold text-slate-700">Generated Course Flow</h2>
  </div>

  <div class="flex-grow p-6 overflow-y-auto">
    @if (isLoading()) {
      <p class="text-slate-400">Generating flowchart…</p>
    }
    @else if (mermaidCode()) {
      <pre class="mermaid">
{{ mermaidCode() }}
      </pre>

      @if (explanation()) {
        <p class="mt-4 text-sm text-slate-600">
          {{ explanation() }}
        </p>
      }
    }
    @else {
      <p class="text-slate-400">No flowchart generated yet.</p>
    }
  </div>
</div>
