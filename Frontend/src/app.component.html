<div class="flex flex-col h-screen overflow-hidden">
  <header class="bg-white shadow-md z-10">
    <div class="container mx-auto px-6 py-4 flex items-center gap-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 12.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM12 5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM12 19.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
      </svg>
      <h1 class="text-2xl font-bold text-slate-800">
        AI College Course Planner
      </h1>
    </div>
  </header>
  <main class="flex-1 overflow-hidden">
  <div class="h-screen p-4 bg-slate-100">
  <main class="grid grid-cols-12 gap-4 h-full">
    <!-- LEFT: Chat -->
    <section class="col-span-3 bg-white rounded-lg shadow overflow-hidden">
      <app-chatbot
        (promptSubmitted)="onPromptSubmitted($event)"
        [isLoading]="loading()"
        [botReply]="coursePlan()?.rag_response ?? ''"
      ></app-chatbot>
    </section>

    <!-- CENTER: Flowchart -->
    <section class="col-span-6 bg-white rounded-lg shadow overflow-y-auto">
      <app-flowchart
        [graph]="coursePlan()?.graph"
        [llm]="coursePlan()?.llm_flowchart"
        [isLoading]="loading()"
      ></app-flowchart>
    </section>

    <!-- RIGHT: Recommendations -->
    <section class="col-span-3 bg-white rounded-lg shadow overflow-y-auto">
      <app-recommendations
        [recommendations]="coursePlan()?.recommendations"
        [isLoading]="loading()"
      ></app-recommendations>
    </section>
  </main>
</div>
