<div class="h-screen w-screen flex bg-slate-50 overflow-hidden">
  <app-nav></app-nav>

  <main class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

  <!-- Persistent chat toggle -->
  <button
    (click)="toggleChat()"
    class="fixed bottom-5 left-[15.5rem] z-50 flex items-center gap-2 rounded-full bg-indigo-600 text-white px-4 py-3 shadow-lg hover:bg-indigo-700 transition-colors"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
    </svg>
    <span class="text-sm font-medium">{{ chatOpen() ? 'Close chat' : 'Chat with planner' }}</span>
  </button>

  <!-- Chat panel — same width as before, taller so more of the conversation is visible at once -->
  @if (chatOpen()) {
    <div class="fixed inset-0 z-30 bg-black/20" (click)="toggleChat()"></div>
    <div class="fixed bottom-20 left-5 z-40 w-[26rem] max-w-[calc(100vw-2.5rem)] h-[44rem] max-h-[calc(100vh-3rem)] bg-white rounded-lg shadow-2xl overflow-hidden flex flex-col">
      <app-chatbot
        (promptSubmitted)="planner.onPromptSubmitted($event)"
        (planningChanged)="planner.onPlanningChanged($event)"
        [isLoading]="planner.loading()"
        [botReply]="planner.coursePlan()?.rag_response"
        [matched]="planner.coursePlan()?.matched"
        [degreePlans]="planner.degreePlans()"
        [activeMajor]="planner.state().major"
        [activeStartYear]="planner.state().startYear"
        [activeGradYears]="planner.state().gradYears"
      ></app-chatbot>
    </div>
  }
</div>
