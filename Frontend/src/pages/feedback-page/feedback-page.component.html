<div class="p-4 md:p-8 max-w-2xl mx-auto pb-16">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Send feedback</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
      Found a bug, or something you wish Coursy did? Tell us here — a real person reads every one.
    </p>
  </div>

  @if (submitted()) {
    <div class="rounded-lg border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950 p-6 text-center">
      <p class="text-sm font-medium text-emerald-800 dark:text-emerald-200">Thanks — that's been sent.</p>
      <button
        type="button"
        (click)="submitAnother()"
        class="mt-3 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline"
      >
        Send another
      </button>
    </div>
  } @else {
    @if (error(); as message) {
      <p role="alert" class="mb-4 rounded-md border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-950 px-4 py-3 text-sm text-red-700 dark:text-red-300">{{ message }}</p>
    }

    <div class="bg-white dark:bg-slate-900 rounded-lg shadow p-6">
      <fieldset class="mb-4">
        <legend class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">
          What kind of feedback is this?
        </legend>
        <div class="flex flex-wrap gap-2">
          @for (c of categories; track c.value) {
            <button
              type="button"
              (click)="category.set(c.value)"
              [attr.aria-pressed]="category() === c.value"
              class="rounded-full px-3.5 py-1.5 text-sm font-medium border transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              [class.bg-indigo-600]="category() === c.value"
              [class.text-white]="category() === c.value"
              [class.border-indigo-600]="category() === c.value"
              [class.border-slate-300]="category() !== c.value"
              [class.dark:border-slate-600]="category() !== c.value"
              [class.text-slate-600]="category() !== c.value"
              [class.dark:text-slate-300]="category() !== c.value"
              [class.hover:bg-slate-50]="category() !== c.value"
              [class.dark:hover:bg-slate-800]="category() !== c.value"
            >
              {{ c.label }}
            </button>
          }
        </div>
      </fieldset>

      <label for="feedback-body" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">
        Tell us what happened
      </label>
      <textarea
        id="feedback-body"
        rows="5"
        maxlength="4000"
        placeholder="The more detail, the better we can act on it — what you were doing, what you expected, what happened instead…"
        class="w-full rounded-md border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-900 p-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [value]="body()"
        (input)="body.set($any($event.target).value)"
      ></textarea>

      <label for="feedback-contact" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">
        Email (optional, if you'd like a reply)
      </label>
      <input
        id="feedback-contact"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        class="w-full rounded-md border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-900 px-2.5 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [value]="contact()"
        (input)="contact.set($any($event.target).value)"
      />

      <button
        type="button"
        [disabled]="!body().trim() || submitting()"
        (click)="submit()"
        class="w-full rounded-md bg-indigo-600 text-white text-sm font-semibold px-4 py-2.5 hover:bg-indigo-700 transition-colors disabled:opacity-50"
      >
        {{ submitting() ? 'Sending…' : 'Send feedback' }}
      </button>
    </div>
  }
</div>
