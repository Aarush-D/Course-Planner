<div class="h-full p-4 md:p-6 max-w-3xl mx-auto">
  <div class="h-full bg-white rounded-lg shadow-lg overflow-y-auto">
    <app-recommendations
      [isLoading]="planner.loading()"
      [recommendations]="planner.coursePlan()?.recommendations"
      [nextSemester]="planner.coursePlan()?.nextSemester"
      [tips]="planner.coursePlan()?.tips"
      [rawText]="planner.coursePlan()?.rag_response"
      [lowCostMinors]="planner.coursePlan()?.lowCostMinors"
      (minorAdded)="onMinorAdded($event)"
    ></app-recommendations>
  </div>
</div>
