<div class="h-full p-4 md:p-6">
  <div class="h-full bg-white dark:bg-slate-900 rounded-lg shadow-lg overflow-y-auto">
    <app-flowchart
      [isLoading]="planner.loading()"
      [courses]="planner.coursePlan()?.flowchart"
      [completedCodes]="planner.state().completed"
      [fullPlan]="planner.coursePlan()?.fullPlan"
      [progress]="planner.coursePlan()?.progress"
      [unlockMap]="planner.coursePlan()?.unlockMap"
      [major]="planner.state().undecided ? null : planner.state().major"
      [catalogYear]="planner.state().catalogYear"
      [scheduledCourseIds]="planner.state().scheduledCourseIds"
      (removeCompleted)="planner.onRemoveCompleted($event)"
      (toggleScheduled)="planner.toggleScheduled($event)"
    ></app-flowchart>
  </div>
</div>
