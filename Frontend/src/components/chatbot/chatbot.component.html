<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200">
    <h2 class="text-lg font-semibold text-slate-700">Advisor Chat</h2>
    <p class="text-xs text-slate-500 mt-1">Select your degree plan and tell me what you've taken.</p>

    <label class="block mt-3 text-xs font-semibold text-slate-600">Major</label>
    <select
      class="mt-1 w-full rounded-md border border-slate-200 bg-white p-2 text-sm"
      [value]="selectedPlan()"
      (change)="selectedPlan.set($any($event.target).value)">
      @for (group of groupedPlanOptions(); track group.college) {
        <optgroup [label]="group.college">
          @for (opt of group.options; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </optgroup>
      }
    </select>

    <!-- Year planning -->
    <div class="mt-3 grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600">Started college</label>
        <select
          class="mt-1 w-full rounded-md border border-slate-200 bg-white p-2 text-sm"
          [value]="startYear()"
          (change)="onStartYearChange($any($event.target).value)">
          @for (y of startYearOptions; track y) {
            <option [value]="y" [selected]="startYear() === y">{{ y }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600">Graduate in</label>
        <select
          class="mt-1 w-full rounded-md border border-slate-200 bg-white p-2 text-sm"
          [value]="gradYears()"
          (change)="onGradYearsChange($any($event.target).value)">
          @for (n of [2, 3, 4, 5]; track n) {
            <option [value]="n" [selected]="gradYears() === n">{{ n }} years</option>
          }
        </select>
      </div>
    </div>

    <!-- Allow Summer Courses toggle -->
    <button
      type="button"
      class="mt-3 w-full flex items-center justify-between rounded-md border border-slate-200 bg-white px-3 py-2"
      (click)="onToggleSummer()"
      [disabled]="isLoading()">
      <span class="text-xs font-semibold text-slate-600">☀️ Allow Summer Courses</span>
      <span
        class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
        [class.bg-emerald-500]="allowSummer()"
        [class.bg-slate-300]="!allowSummer()">
        <span
          class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
          [class.translate-x-4]="allowSummer()"
          [class.translate-x-0.5]="!allowSummer()"></span>
      </span>
    </button>
  </div>

  <!-- Messages (min-h-0 lets this flex child shrink so overflow-y can scroll) -->
  <div #messagesArea class="flex-1 min-h-0 p-4 overflow-y-auto space-y-3 bg-slate-50">
    @for (m of messages(); track $index) {
      <div
        class="max-w-[95%] rounded-lg px-3 py-2 text-sm shadow-sm whitespace-pre-line"
        [class.ml-auto]="m.role === 'user'"
        [class.bg-indigo-600]="m.role === 'user'"
        [class.text-white]="m.role === 'user'"
        [class.bg-white]="m.role === 'assistant'"
        [class.text-slate-700]="m.role === 'assistant'">
        {{ m.text }}
      </div>
    }

    @if (isLoading()) {
      <div class="bg-white text-slate-600 rounded-lg px-3 py-2 text-sm shadow-sm w-fit animate-pulse">
        Planning…
      </div>
    }
  </div>

  <!-- Input -->
  <div class="p-4 border-t border-slate-200 bg-white">
    <textarea
      class="w-full resize-none rounded-md border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"
      rows="3"
      placeholder="e.g. I took CMPSC 131 and calc 1 — what should I take next?"
      [value]="prompt()"
      (input)="prompt.set($any($event.target).value)"
      (keydown)="onKeyDown($event)"></textarea>

    <button
      class="mt-2 w-full rounded-md bg-indigo-600 text-white py-2 text-sm font-semibold disabled:opacity-50"
      (click)="onSubmit()"
      [disabled]="isLoading()">
      Send
    </button>
  </div>
</div>
