<div class="flex flex-col h-full">
  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3">
    @for (m of messages(); track $index) {
      <div class="flex" [class.justify-end]="m.sender === 'user'">
        <div
          class="max-w-[85%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap"
          [class.bg-indigo-600]="m.sender === 'user'"
          [class.text-white]="m.sender === 'user'"
          [class.bg-slate-100]="m.sender === 'bot'"
          [class.text-slate-800]="m.sender === 'bot'"
        >
          {{ m.text }}
        </div>
      </div>
    }

    @if (isLoading()) {
      <div class="text-slate-400 text-sm italic">Thinking…</div>
    }
  </div>

  <!-- Input -->
  <div class="border-t p-3 flex gap-2">
    <input
      class="flex-1 border rounded px-3 py-2 text-sm"
      [(ngModel)]="userInput()"
      placeholder="Ask about courses…"
      (keydown.enter)="sendMessage()"
    />
    <button
      class="bg-indigo-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
      [disabled]="!hasUserInput() || isLoading()"
      (click)="sendMessage()"
    >
      Send
    </button>
  </div>
</div>
