<div class="flex flex-col h-full relative">
  <button
    type="button"
    aria-label="Close chat"
    class="absolute top-3 right-3 z-20 flex h-7 w-7 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors"
    (click)="onClose()">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </button>

  <div class="p-4 pr-12 border-b border-slate-200">
    <h2 class="text-lg font-semibold text-slate-700">Advisor Chat</h2>
    <p class="text-xs text-slate-500 mt-1">Tell me what you've taken, or ask what's next.</p>

    <!-- Allow Summer Courses toggle — the one setting that genuinely
         changes turn-to-turn, so it stays here (not in Setup) but moved to
         the top since it's the first thing worth seeing when chat opens. -->
    <button
      type="button"
      data-tour="chat-summer"
      class="mt-3 w-full flex items-center justify-between rounded-md border border-slate-200 bg-white px-3 py-2"
      (click)="onToggleSummer()"
      [disabled]="planner.loading()">
      <span class="text-xs font-semibold text-slate-600">☀️ Allow Summer Courses</span>
      <span
        class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
        [class.bg-emerald-500]="planner.state().allowSummer"
        [class.bg-slate-300]="!planner.state().allowSummer">
        <span
          class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
          [class.translate-x-4]="planner.state().allowSummer"
          [class.translate-x-0.5]="!planner.state().allowSummer"></span>
      </span>
    </button>
  </div>

  <!-- Messages (min-h-0 lets this flex child shrink so overflow-y can scroll) -->
  <div #messagesArea class="flex-1 min-h-0 p-4 overflow-y-auto space-y-3 bg-slate-50">
    @for (m of planner.chatMessages(); track $index) {
      <div class="max-w-[95%]" [class.ml-auto]="m.role === 'user'">
        <div
          class="rounded-lg px-3 py-2 text-sm shadow-sm whitespace-pre-line"
          [class.bg-indigo-600]="m.role === 'user'"
          [class.text-white]="m.role === 'user'"
          [class.bg-white]="m.role === 'assistant'"
          [class.text-slate-700]="m.role === 'assistant'">
          {{ m.text }}
        </div>
        @if (m.links?.length) {
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            @for (link of m.links; track link.route) {
              <a
                [routerLink]="link.route"
                class="inline-flex items-center gap-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-medium px-2.5 py-1 hover:bg-indigo-100 transition-colors">
                {{ link.label }} →
              </a>
            }
          </div>
        }
      </div>
    }

    @if (planner.loading()) {
      <div class="bg-white text-slate-600 rounded-lg px-3 py-2 text-sm shadow-sm w-fit animate-pulse">
        Planning…
      </div>
    }
  </div>

  <!-- Input -->
  <div class="p-4 border-t border-slate-200 bg-white" data-tour="chat-input">
    <textarea
      class="w-full resize-none rounded-md border border-slate-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 disabled:bg-slate-100 disabled:text-slate-400"
      rows="3"
      placeholder="e.g. I took CMPSC 131 and calc 1 — what should I take next?"
      [disabled]="planner.noProgramsForCampus()"
      [value]="prompt()"
      (input)="prompt.set($any($event.target).value)"
      (keydown)="onKeyDown($event)"></textarea>

    <button
      class="mt-2 w-full rounded-md bg-indigo-600 text-white py-2 text-sm font-semibold disabled:opacity-50"
      (click)="onSubmit()"
      [disabled]="planner.loading() || planner.noProgramsForCampus()">
      Send
    </button>
  </div>
</div>
