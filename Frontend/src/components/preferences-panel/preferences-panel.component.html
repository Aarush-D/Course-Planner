<div
  data-tour="preferences-toggle"
  class="relative"
>
  <button
    type="button"
    (click)="toggleOpen()"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 shadow hover:bg-slate-50 dark:hover:bg-slate-700 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
    aria-label="Preferences"
    title="Preferences"
    [attr.aria-expanded]="open()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
    </svg>
  </button>

  @if (open()) {
    <div class="absolute right-0 mt-2 w-64 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg p-3">
      <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500 mb-2">Preferences</p>

      @if (!planner.state().undecided) {
        <button
          type="button"
          class="w-full flex items-center justify-between rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2"
          (click)="onToggleSummer()"
          [disabled]="planner.loading()"
        >
          <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">☀️ Allow Summer Courses</span>
          <span
            class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
            [class.bg-emerald-500]="planner.state().allowSummer"
            [class.bg-slate-300]="!planner.state().allowSummer" [class.dark:bg-slate-600]="!planner.state().allowSummer">
            <span
              class="inline-block h-4 w-4 transform rounded-full bg-white dark:bg-slate-900 shadow transition-transform"
              [class.translate-x-4]="planner.state().allowSummer"
              [class.translate-x-0.5]="!planner.state().allowSummer"></span>
          </span>
        </button>
      } @else {
        <p class="text-xs text-slate-400 dark:text-slate-500 italic">No preferences yet — pick a major first.</p>
      }
    </div>
  }
</div>
