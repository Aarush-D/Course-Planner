<span class="inline-flex items-center gap-0.5" (mouseleave)="onHoverEnd()">
  @for (star of stars; track star) {
    <button
      type="button"
      [disabled]="!interactive()"
      (click)="onClick(star)"
      (mouseenter)="onHover(star)"
      [attr.aria-label]="interactive() ? 'Rate ' + star + ' star' + (star > 1 ? 's' : '') : null"
      class="p-0"
      [class.cursor-pointer]="interactive()"
      [class.cursor-default]="!interactive()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        [class.w-5]="interactive()" [class.h-5]="interactive()"
        [class.text-amber-400]="isFilled(star)"
        [class.text-slate-300]="!isFilled(star)" [class.dark:text-slate-600]="!isFilled(star)"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.958a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.368 2.447a1 1 0 00-.363 1.118l1.287 3.957c.3.922-.755 1.688-1.54 1.118l-3.367-2.446a1 1 0 00-1.176 0l-3.367 2.446c-.784.57-1.838-.196-1.539-1.118l1.286-3.957a1 1 0 00-.363-1.118L2.83 9.385c-.783-.57-.38-1.81.588-1.81h4.163a1 1 0 00.95-.69l1.286-3.958z" />
      </svg>
    </button>
  }
  @if (!interactive() && count() !== null) {
    <span class="ml-1 text-[11px] text-slate-400 dark:text-slate-500 tabular-nums">({{ count() }})</span>
  }
</span>
