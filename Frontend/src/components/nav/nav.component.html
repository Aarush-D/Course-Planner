<div class="fixed top-4 left-4 z-40">
  <button
    #toggleButton
    type="button"
    (click)="toggleOpen()"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 shadow hover:bg-slate-50 dark:hover:bg-slate-700 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
    [attr.aria-label]="open() ? 'Close navigation' : 'Open navigation'"
    [attr.aria-expanded]="open()"
    title="Navigation"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      @if (open()) {
        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
      } @else {
        <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
      }
    </svg>
  </button>

  @if (open()) {
    <nav
      data-tour="nav-sidebar"
      class="absolute left-0 top-full mt-2 w-64 max-h-[calc(100vh-5rem)] flex flex-col overflow-y-auto rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl py-3 px-3 gap-1"
    >
      <div class="px-2 pb-3 mb-1 border-b border-slate-100 dark:border-slate-800">
        <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">Coursy</p>
        <p class="text-xs text-slate-500 dark:text-slate-400">Your PSU degree, in one place</p>
      </div>

      <a
        routerLink="/"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
        </svg>
        Home
      </a>

      <a
        routerLink="/flowchart"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H6v3h3v-1a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-1H6a2 2 0 01-2-2V9H3a1 1 0 01-1-1V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Flowchart
      </a>

      <a
        routerLink="/progress"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
        </svg>
        Progress
      </a>

      <a
        routerLink="/general-education"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0z" />
        </svg>
        General education
      </a>

      <a
        routerLink="/transferred-courses"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 01-9.201 2.466l-.312-.311h2.433a.75.75 0 000-1.5H3.989a.75.75 0 00-.75.75v4.242a.75.75 0 001.5 0v-2.43l.31.31a7 7 0 0011.712-3.138.75.75 0 00-1.449-.39zm1.23-3.723a.75.75 0 00.219-.53V2.929a.75.75 0 00-1.5 0V5.36l-.31-.31A7 7 0 003.239 8.188a.75.75 0 101.448.389A5.5 5.5 0 0113.89 6.11l.311.31h-2.432a.75.75 0 000 1.5h4.243a.75.75 0 00.53-.219z" clip-rule="evenodd" />
        </svg>
        Transferred courses
      </a>

      <a
        routerLink="/recommendations"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z" />
        </svg>
        Recommendations
      </a>

      <!-- Set-once basics — campus/major/minors/majorCount/startYear/gradYears.
           A real page (like Flowchart or Recommendations), not a permanent
           sidebar fixture — the fields are configured once up front, not on
           every turn, so they don't need to always be visible. Same fields
           also appear in the first-visit onboarding modal
           (app.component.html); this link is where a student comes back to
           change their mind later. -->
      <!-- Divider lives on a wrapper (same as the demo-login section below),
           not on the <a> itself -- on the link it made this one row taller
           than its siblings and let the hover background paint over the
           rule. -->
      <div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-800">
        <a
          routerLink="/your-plan"
          routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        >
          <!-- Same person silhouette as the demo icon below, but with a gear in
               place of the head -- this is the student's own settings, not a
               sample account. -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 2.4 11 3.83 12.55 3.45 12.17 5.1 13.6 6 12.17 6.9 12.55 8.55 11 8.17 10 9.6 9 8.17 7.45 8.55 7.83 6.9 6.4 6 7.83 5.1 7.45 3.45 9 3.83Z M11.15 6a1.15 1.15 0 11-2.3 0 1.15 1.15 0 012.3 0Z" clip-rule="evenodd" />
            <path fill-rule="evenodd" d="M3 18a7 7 0 1114 0H3z" clip-rule="evenodd" />
          </svg>
          Your plan
        </a>
      </div>

      <a
        routerLink="/faq"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
        ariaCurrentWhenActive="page"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0ZM8.94 6.94a.75.75 0 1 1-1.061-1.061 3 3 0 1 1 2.871 5.026v.345a.75.75 0 0 1-1.5 0v-.5c0-.72.57-1.172 1.081-1.287A1.5 1.5 0 1 0 8.94 6.94ZM10 15a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
        </svg>
        FAQ
      </a>

      <div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-800">
        <a
          routerLink="/demo-login"
          routerLinkActive="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300"
          ariaCurrentWhenActive="page"
          class="flex items-center justify-between gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        >
          <span class="flex items-center gap-2.5 whitespace-nowrap">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
            Try a demo student
          </span>
          <span class="text-[9px] font-bold uppercase tracking-wide bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 rounded px-1 py-0.5">Demo</span>
        </a>
      </div>

      <div class="mt-auto pt-3 px-3 flex items-center gap-3 text-[11px] text-slate-500 dark:text-slate-400">
        <a routerLink="/privacy" class="hover:text-slate-600 dark:hover:text-slate-300 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded">Privacy</a>
        <a routerLink="/terms" class="hover:text-slate-600 dark:hover:text-slate-300 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded">Terms</a>
      </div>
    </nav>
  }
</div>
