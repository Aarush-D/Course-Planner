<!-- Bottom-left so it never collides with the chat toggle (bottom-right) or
     the theme/help buttons (top-right). -->
<div class="fixed bottom-5 left-5 z-50 flex flex-col-reverse gap-2 pointer-events-none" aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
    <div
      #toastEl
      [attr.data-toast-id]="t.id"
      class="pointer-events-auto flex items-center gap-2 rounded-lg shadow-lg px-4 py-2.5 text-sm font-medium max-w-xs text-white animate-[toast-in_0.15s_ease-out]"
      [class.bg-slate-800]="t.kind === 'success'"
      [class.dark:bg-slate-100]="t.kind === 'success'"
      [class.dark:text-slate-800]="t.kind === 'success'"
      [class.bg-red-600]="t.kind === 'error'"
    >
      @if (t.kind === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
      }
      <span class="min-w-0">{{ t.text }}</span>
      <button
        (click)="animateAndDismiss(t.id)"
        class="ml-1 flex-shrink-0 opacity-70 hover:opacity-100"
        aria-label="Dismiss"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  }
</div>
