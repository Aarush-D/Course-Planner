<div class="relative">
  @if (supabase.session()) {
    <button
      #toggleButton
      type="button"
      (click)="toggleOpen()"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-white font-semibold text-sm shadow hover:bg-indigo-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      [attr.aria-label]="'Account menu — signed in as ' + email()"
      [title]="email()"
      [attr.aria-expanded]="open()"
    >
      {{ initial() }}
    </button>

    @if (open()) {
      <div class="absolute right-0 mt-2 w-56 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg p-3">
        <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Signed in as</p>
        <p class="text-sm text-slate-700 dark:text-slate-200 truncate mb-3">{{ email() }}</p>
        <div class="border-t border-slate-100 dark:border-slate-800 -mx-3 px-3 pt-2.5 pb-3 mb-2">
          <label [attr.for]="'account-menu-linkedin'" class="block text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">
            LinkedIn (optional)
          </label>
          <input
            id="account-menu-linkedin"
            type="url"
            placeholder="https://linkedin.com/in/you"
            class="w-full rounded-md border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-900 px-2 py-1.5 text-xs mb-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
            [value]="linkedinUrl()"
            (input)="linkedinUrl.set($any($event.target).value)"
          />
          <label class="flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300 mb-1.5">
            <input
              type="checkbox"
              class="rounded border-slate-400 dark:border-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              [checked]="linkedinPublic()"
              (change)="linkedinPublic.set($any($event.target).checked)"
            />
            Visible to classmates you share an enrolled course with
          </label>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 mb-1.5">
            Off by default. Never a public directory — only classmates in the same real, applied-for course can see it.
          </p>
          <button
            type="button"
            [disabled]="savingProfile()"
            (click)="saveLinkedin()"
            class="w-full rounded-md border border-slate-300 dark:border-slate-600 text-xs font-medium text-slate-600 dark:text-slate-300 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          >
            {{ savingProfile() ? 'Saving…' : 'Save' }}
          </button>
        </div>

        <button
          type="button"
          (click)="signOut()"
          class="w-full rounded-md border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-600 dark:text-slate-300 py-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        >
          Sign out
        </button>
        <button
          type="button"
          [disabled]="deleting()"
          (click)="deleteAccount()"
          class="w-full mt-1.5 rounded-md text-xs font-medium text-red-600 dark:text-red-400 py-1.5 hover:bg-red-50 dark:hover:bg-red-950 disabled:opacity-50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-600"
        >
          {{ deleting() ? 'Deleting…' : 'Delete account' }}
        </button>
      </div>
    }
  } @else {
    <a
      routerLink="/login"
      class="flex h-10 items-center justify-center rounded-full bg-indigo-600 text-white text-sm font-semibold px-6 shadow hover:bg-indigo-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
    >
      Sign in
    </a>
  }
</div>
