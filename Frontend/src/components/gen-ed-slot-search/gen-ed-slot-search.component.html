<div class="text-xs">
  @if (!expanded()) {
    <button
      type="button"
      class="inline-flex items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded"
      (click)="toggle()">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      Search for a course
    </button>
  } @else {
    <div class="relative max-w-xs" (focusout)="onFocusOut($event)">
      <div class="flex items-center gap-1.5">
        <div class="relative flex-1">
          <input
            type="text"
            aria-label="Search courses for this requirement"
            class="w-full rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 py-1.5 pl-7 pr-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Search a course…"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
            (focus)="onFocus()" />
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 absolute left-2 top-1/2 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
          </svg>
        </div>
        <button
          type="button"
          class="shrink-0 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded"
          aria-label="Close course search"
          (click)="toggle()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      @if (open() && filtered().length) {
        <div class="absolute z-10 mt-1 max-h-52 w-full min-w-[16rem] overflow-y-auto rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg">
          @for (c of filtered(); track c.code) {
            <button
              type="button"
              class="flex w-full items-center gap-2 px-3 py-1.5 text-left text-xs hover:bg-indigo-50 dark:hover:bg-indigo-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              (mousedown)="$event.preventDefault(); select(c)">
              <span class="min-w-0 flex-1 truncate">
                <span class="font-semibold">{{ c.code }}</span>
                <span class="text-slate-500 dark:text-slate-400"> — {{ c.title }}</span>
              </span>
              <span class="shrink-0 font-medium text-indigo-600 dark:text-indigo-400">Add to plan</span>
            </button>
          }
        </div>
      } @else if (open() && query().trim()) {
        <div aria-live="polite" class="absolute z-10 mt-1 w-full min-w-[16rem] rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg px-3 py-2 text-xs text-slate-500 dark:text-slate-400">
          No approved course matches “{{ query() }}”
        </div>
      }
    </div>
  }
</div>
