<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Coursy</title>
</head>
<body>
  <script>
    // GitHub Pages serves this file for any path it doesn't recognize as a
    // real static file -- which is every one of this Angular app's
    // client-side routes on a fresh/direct hit (e.g. bookmarking
    // /Course-Planner/app/advisor/dashboard). There's no server-side
    // rewrite available on GH Pages, so this is the standard SPA fallback:
    // redirect to the app's real root with the intended path folded into a
    // query string, then index.html's own pre-boot script restores it via
    // history.replaceState before Angular's router reads the location.
    //
    // This copy lives at the SITE ROOT (docs/404.html) deliberately --
    // GitHub Pages only honors one site-wide custom 404, served from the
    // published root, never from a nested directory. A second copy also
    // exists at docs/app/404.html (Frontend/public/404.html, copied in by
    // every `ng build` via angular.json's assets config) -- that one is
    // real and reachable at its own literal URL, but GitHub Pages never
    // actually serves it AS the 404 fallback, so on its own it did nothing
    // for a direct hit on an unmatched path. This root copy is hand-
    // maintained, not part of the Angular build output, specifically so
    // `rm -rf docs/app` on every production rebuild can never delete it.
    // Keep the two in sync if this script ever changes.
    var base = '/Course-Planner/app/';
    var afterBase = location.pathname.slice(base.length) + location.search + location.hash;
    location.replace(base + '?redirect=' + encodeURIComponent(afterBase));
  </script>
</body>
</html>
