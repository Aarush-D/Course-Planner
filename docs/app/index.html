<!DOCTYPE html>
<html lang="en" data-beasties-container>
<head>
  <meta charset="utf-8">
  <!-- Anchors every relative URL (the bootstrap script, favicon, etc.) to
       root regardless of the current path's depth -- without this, a
       fresh/direct load on a multi-segment route (e.g. /advisor/login)
       resolves "main.js" against */advisor/* instead of root and 404s. The
       production build's own --base-href flag overwrites this value at
       build time (see Frontend/angular.json's fileReplacements/config),
       so this only matters for `ng serve`. -->
  <base href="/Course-Planner/app/">
  <title>Coursy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Matches <body>'s own bg-slate-50 so the mobile browser chrome blends
       into the page instead of framing it in white. Deliberately ONE tag
       with no `media` attribute: this app's theme is class-based, not
       OS-derived (a student can run dark mode on a light-mode OS and vice
       versa), and a prefers-color-scheme media query would read the OS
       instead of the actual theme and get it exactly backwards for anyone
       who toggled. ThemeService owns the live value from here -- it
       rewrites this content on every toggle. -->
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Both real backends, connected to on the very first interaction (the
       Supabase session probe on boot, and the API as soon as a plan
       loads). Render free-tier instances cold-start, so paying the
       DNS/TLS handshake up front is worth more here than on a warm host. -->
  <link rel="preconnect" href="https://course-planner-pzdl.onrender.com">
  <link rel="preconnect" href="https://rfyxmpzomwhftbahinqb.supabase.co">
  <!-- Penn State brand typography (Mulish for body/UI text, Zilla Slab for
       the opt-in font-display heading utility -- see tailwind.config.cjs).
       Google Fonts is the one external font host the CSP below allows. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Security-audit fix: no CSP existed anywhere in the stack. GitHub
       Pages (this file's own host) can't set real HTTP response headers,
       so a <meta> tag is the only way to apply one here at all -- see
       Backend/app.py's after_request hook for the real header on the API
       side (that's also where frame-ancestors actually lives -- the CSP
       spec doesn't let a <meta> tag enforce it at all, confirmed live via
       a real "frame-ancestors ... is ignored when delivered via a <meta>
       element" console warning; X-Content-Type-Options/X-Frame-Options
       there cover this half's clickjacking protection instead). script-
       src/style-src need 'unsafe-inline': the two small pre-boot <script>
       blocks below (dark-mode-flash and the GH-Pages SPA-redirect
       restore) must stay inline to run before Angular bootstraps, and
       this whole app is built on Angular's [style.x] property bindings,
       which render as real inline style="" attributes -- neither has a
       practical nonce/hash option for a plain static index.html.
       worker-src needs its own 'self' blob: (confirmed live: without it,
       script-src's fallback default doesn't include blob:, and Mermaid's
       flowchart rendering creates a worker from a blob: URL for layout —
       that failed silently until this was added). connect-src is the
       part doing the real work: only this app's own two real backends,
       nothing else. style-src/font-src each get exactly one added
       exception, fonts.googleapis.com/fonts.gstatic.com, for the Penn
       State brand typeface load above -- Google Fonts is the only
       external font host this CSP admits. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self' https://course-planner-pzdl.onrender.com https://rfyxmpzomwhftbahinqb.supabase.co wss://rfyxmpzomwhftbahinqb.supabase.co; object-src 'none'; base-uri 'self';">
  <script>
    // Pairs with public/404.html's GH-Pages SPA fallback -- restores the
    // real deep-link path (e.g. /advisor/dashboard) before Angular's router
    // reads the current location, so a fresh/direct hit on a client-side
    // route resolves correctly instead of landing on Home. A no-op outside
    // that redirect (including in dev, where Vite's own server already
    // handles this natively and never produces a `?redirect=` param).
    (function () {
      var m = location.search.match(/[?&]redirect=([^&]*)/);
      if (!m) return;
      history.replaceState(null, '', location.pathname + decodeURIComponent(m[1]));
    })();
  </script>
  <script>
    // Applied before Angular boots (and before first paint) so a returning
    // dark-mode user never sees a flash of the light theme. Mirrors
    // ThemeService's own persistence key/logic -- see
    // Frontend/src/services/theme.service.ts. Defaults to light (white
    // background) for a first-time visitor -- only an explicit prior
    // toggle turns this on, regardless of OS preference.
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* A modest bump to the root size (16px -> 17px) scales every rem-based
       Tailwind utility in the app proportionally -- slightly more readable
       body/label text everywhere, without touching each individual
       text-sm/text-xs class across dozens of templates. */
    html {
      font-size: 106.25%;
    }

    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .dark ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Toast entrance (see components/toast/toast.component.html) -- a
       Tailwind arbitrary-value animation still needs its @keyframes
       defined somewhere real, since Tailwind can't generate the frames
       themselves from the class name alone. */
    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(0.5rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* The home page's "overall complete" ring is drawn with an inline
       conic-gradient (see home-page.component.html) -- inline styles can't
       be overridden by Tailwind's dark: classes, so its track color has to
       come from a variable instead. */
    :root {
      --ring-track: #e2e8f0;
      /* Tells the browser which scheme the page is actually painted in, so
         native UI it renders for us -- form controls, the Firefox
         scrollbar, spinners, date pickers -- follows the theme. Tailwind's
         `dark:` classes only restyle OUR elements; they can't reach these.
         Driven by the .dark class (not prefers-color-scheme) because that
         class is this app's single source of truth: the pre-boot script
         above sets it from localStorage, and ThemeService toggles it. */
      color-scheme: light;
    }
    .dark {
      --ring-track: #334155;
      color-scheme: dark;
    }

    /* Kills the ~300ms tap delay mobile browsers hold in case a tap turns
       into a double-tap-to-zoom, on the interactive elements only -- page
       content stays double-tap zoomable. The tap highlight is set
       deliberately rather than left to each browser's default blue-grey
       flash, which clashes with the indigo hover/active states. */
    button,
    a,
    input,
    select,
    textarea,
    summary,
    [role='button'],
    [role='option'] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgb(99 102 241 / 0.15);
    }

    /* One global guard, rather than a prefers-reduced-motion branch beside
       every animation. The two JS-driven ones (modal fades, toast exit)
       check prefersReducedMotion() themselves and skip entirely -- see
       src/animations/reduced-motion.ts -- but every CSS transition in the
       app was unguarded until this, including the tour overlay's moving
       spotlight, which is the most motion-heavy surface here.
       Near-zero instead of `none`: a 0s duration skips transitionend/
       animationend entirely, and code that awaits one would hang. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      /* Loading indicators are exempt, deliberately. The rule above exists
         for vestibular safety -- large, sweeping, decorative motion. A
         spinner and a skeleton shimmer are neither: they are the only
         signal that the app is still working, and freezing them (16 pulse
         skeletons plus the transcript-upload spinner) turns "loading" into
         "hung" for exactly the users least equipped to tell those apart.
         WCAG 2.3.3 scopes itself to non-essential motion for this reason.
         Values restore Tailwind's own defaults. */
      .animate-spin {
        animation-duration: 1s !important;
        animation-iteration-count: infinite !important;
      }
      .animate-pulse {
        animation-duration: 2s !important;
        animation-iteration-count: infinite !important;
      }
    }
  </style>
