  <script>
    // Applied before Angular boots (and before first paint) so a returning
    // dark-mode user never sees a flash of the light theme. Mirrors
    // ThemeService's own persistence key/logic -- see
    // Frontend/src/services/theme.service.ts. Defaults to light (white
    // background) for a first-time visitor -- only an explicit prior
    // toggle turns this on, regardless of OS preference.
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

    /* A modest bump to the root size (16px -> 17px) scales every rem-based
       Tailwind utility in the app proportionally -- slightly more readable
       body/label text everywhere, without touching each individual
       text-sm/text-xs class across dozens of templates. */
    html {
      font-size: 106.25%;
    }

    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {

    ::-webkit-scrollbar-track {

    }
    ::-webkit-scrollbar-thumb {

      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {

    .dark ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .dark ::-webkit-scrollbar-thumb:hover {

    }

    /* Toast entrance (see components/toast/toast.component.html) -- a
       Tailwind arbitrary-value animation still needs its @keyframes
       defined somewhere real, since Tailwind can't generate the frames
       themselves from the class name alone. */
    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(0.5rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* The home page's "overall complete" ring is drawn with an inline
       conic-gradient (see home-page.component.html) -- inline styles can't
       be overridden by Tailwind's dark: classes, so its track color has to
       come from a variable instead. */
    :root {
      --ring-track: #e2e8f0;
    }
    .dark {
      --ring-track: #334155;
    }
  </style>
